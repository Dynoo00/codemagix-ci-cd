workflows:
  android-firebase-distribution:
    name: Android CI/CD - Firebase App Distribution
    max_build_duration: 60

    instance_type: mac_mini_m2
    
    environment:
      flutter: stable
      groups:
        - firebase_credentials
      android_signing:
        - codemagic_keystore

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Analyze Flutter code
        script: flutter analyze

      - name: Run Flutter tests
        script: flutter test

      - name: Build signed Android APK
        script: |
          flutter build apk --release \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT

        android:
          app_id: $FIREBASE_ANDROID_APP_ID
          groups:
            - android-testers
          artifact_type: apk
      
      email:
        recipients:
          - dhiraj.c@elyxdigital.com
        notify:
          success: true
          failure: false